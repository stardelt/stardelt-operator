apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lakehouses.stardelt.io
spec:
  group: stardelt.io
  names:
    categories: []
    kind: Lakehouse
    plural: lakehouses
    shortNames:
    - lh
    singular: lakehouse
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A managed Trino + catalog + Iceberg unit on object storage.
        properties:
          spec:
            description: 'A managed lakehouse: catalog + storage (+ query) on object storage.'
            properties:
              adopt:
                default: false
                description: Take over Helm releases this operator did not create. Off by default so a Lakehouse can never silently clobber an existing install.
                type: boolean
              catalog:
                default:
                  implementation: lakekeeper
                properties:
                  implementation:
                    default: lakekeeper
                    description: Catalog implementation (the plug behind the Iceberg REST contract).
                    enum:
                    - lakekeeper
                    - polaris
                    type: string
                type: object
              dryRun:
                default: true
                description: Plan only (no cluster changes) until explicitly disabled.  Safe default.
                type: boolean
              profile:
                default: demo
                description: Deployment size / capability profile.
                enum:
                - demo
                - full
                - airgap
                type: string
              set:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                description: '`--set` overrides per component: `set.<component>.<helm.key>: "value"`. Highest precedence — Helm applies `--set` after any values document.'
                type: object
              storage:
                default:
                  bucket: null
                  implementation: seaweedfs
                properties:
                  bucket:
                    nullable: true
                    type: string
                  implementation:
                    default: seaweedfs
                    description: Object-store implementation.
                    enum:
                    - seaweedfs
                    - byoS3
                    type: string
                type: object
              values:
                additionalProperties:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                description: Free-form Helm values per component, e.g. `values.trino.worker.resources`. Deep-merged over the golden defaults, so one key can be pinned without restating the rest.
                type: object
              valuesFrom:
                additionalProperties:
                  description: 'External source of one component''s Helm values: set exactly one of `configMapRef` or `secretRef`.'
                  properties:
                    configMapRef:
                      description: Read the values document from this ConfigMap key.
                      nullable: true
                      properties:
                        key:
                          description: Key holding the YAML values document.
                          type: string
                        name:
                          description: Name of the ConfigMap or Secret.
                          type: string
                        namespace:
                          description: Namespace of the referenced object. Defaults to the resource's own namespace; required for cluster-scoped resources (`PlatformInstance`).
                          nullable: true
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    secretRef:
                      description: Read the values document from this Secret key (decoded, then parsed as YAML).
                      nullable: true
                      properties:
                        key:
                          description: Key holding the YAML values document.
                          type: string
                        name:
                          description: Name of the ConfigMap or Secret.
                          type: string
                        namespace:
                          description: Namespace of the referenced object. Defaults to the resource's own namespace; required for cluster-scoped resources (`PlatformInstance`).
                          nullable: true
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  type: object
                description: External values documents per component, read from a ConfigMap or Secret key.
                type: object
            type: object
          status:
            nullable: true
            properties:
              components:
                default: []
                items:
                  properties:
                    message:
                      nullable: true
                      type: string
                    name:
                      type: string
                    ready:
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              conditions:
                default: []
                items:
                  properties:
                    last_transition_time:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              phase:
                default: ''
                type: string
            type: object
        required:
        - spec
        title: Lakehouse
        type: object
    served: true
    storage: true
    subresources:
      status: {}
