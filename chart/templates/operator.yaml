{{- if gt (int .Values.replicaCount) 1 }}{{- fail "replicaCount > 1 is not supported yet: the operator has no leader election, and replicas would run concurrent helm upgrades" }}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardelt-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stardelt-operator
rules:
  - apiGroups: ["stardelt.io"]
    resources: ["platforminstances", "lakehouses", "ingestionsources", "pipelines", "connections"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stardelt.io"]
    resources:
      - "platforminstances/status"
      - "lakehouses/status"
      - "ingestionsources/status"
      - "pipelines/status"
      - "connections/status"
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Helm creates the target namespace (--create-namespace).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # The operator installs upstream charts with Helm, so it applies whatever the
  # charts contain, cluster-wide. This is the documentation-worthy part of the
  # RBAC: an installer operator is a privileged component by nature.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stardelt-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stardelt-operator
subjects:
  - kind: ServiceAccount
    name: stardelt-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardelt-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: stardelt-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stardelt-operator
  template:
    metadata:
      labels:
        app: stardelt-operator
    spec:
      serviceAccountName: stardelt-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
