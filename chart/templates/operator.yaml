apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardelt-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stardelt-operator
rules:
  - apiGroups: ["stardelt.io"]
    resources:
      - "platforminstances"
      - "lakehouses"
      - "ingestionsources"
      - "pipelines"
      - "connections"
      - "serviceprincipals"
      - "sparkclusters"
      - "catalogs"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stardelt.io"]
    resources:
      - "platforminstances/status"
      - "lakehouses/status"
      - "ingestionsources/status"
      - "pipelines/status"
      - "connections/status"
      - "serviceprincipals/status"
      - "sparkclusters/status"
      - "catalogs/status"
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Helm creates the target namespace (--create-namespace).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # The operator installs upstream charts with Helm, so it applies whatever the
  # charts contain, cluster-wide. This is the documentation-worthy part of the
  # RBAC: an installer operator is a privileged component by nature.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stardelt-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stardelt-operator
subjects:
  - kind: ServiceAccount
    name: stardelt-operator
    namespace: {{ .Release.Namespace }}
---
# The ServicePrincipal controller reads the credentials Secret of each principal. That right is
# namespaced on purpose: reading every Secret in the cluster is more than the check needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stardelt-operator-principals
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stardelt-operator-principals
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stardelt-operator-principals
subjects:
  - kind: ServiceAccount
    name: stardelt-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardelt-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: stardelt-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stardelt-operator
  template:
    metadata:
      labels:
        app: stardelt-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: stardelt-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8082
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            # Leader election (#75): the Lease stardelt-operator-leader names this pod.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
# The operator's Prometheus endpoint (stardelt-operator#607): a stable name to select,
# ClusterIP only — no ingress exposes it.
apiVersion: v1
kind: Service
metadata:
  name: stardelt-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: stardelt-operator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app: stardelt-operator
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
