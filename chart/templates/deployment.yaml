apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stardelt-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stardelt-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stardelt-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stardelt-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: STARDELT_OPERATOR_FIELD_MANAGER
              value: {{ .Values.config.fieldManager | quote }}
            - name: STARDELT_OPERATOR_RESYNC_SECS
              value: {{ .Values.config.resyncSecs | quote }}
            - name: STARDELT_OPERATOR_POLL_SECS
              value: {{ .Values.config.pollSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
