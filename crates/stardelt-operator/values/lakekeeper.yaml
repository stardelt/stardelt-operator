# The catalog database is the CloudNative-PG Cluster `lakekeeper-pg` that the
# operator applies itself (prerequisites.rs); the short Service name resolves
# inside the Lakehouse's namespace. Authorization stays `allowall` until the
# OpenFGA work (docs#64); the bundled Postgres and OpenFGA are off.
helmWait: true
postgresql:
  enabled: false
externalDatabase:
  type: postgres
  host_read: lakekeeper-pg-rw
  host_write: lakekeeper-pg-rw
  port: 5432
  database: lakekeeper
  userSecret: lakekeeper-pg-app
  userSecretKey: username
  passwordSecret: lakekeeper-pg-app
  passwordSecretKey: password
authz:
  backend: allowall
internalOpenFGA: false
catalog:
  # Pod Security `restricted` (platform#1096 question 5, twin of platform#1196). Both keys are the
  # chart's camelCase catalog keys; each REPLACES the chart's block for the catalog Deployment, its
  # `check-db` init container and the `lakekeeper-db-migration-<revision>` Job. The chart keeps
  # `runAsUser: 65532` / `runAsGroup: 65534` from `catalog.image.uid/gid`, and `restricted` does not
  # constrain `fsGroup`; `runAsNonRoot` and `seccompProfile` are what complete the profile. This
  # path runs with `authz.backend: allowall`, so it renders no `opa` sidecar and no exception.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
  prometheus:
    # The chart adds a `metrics` port (9000) to the `lakekeeper` Service and the
    # scrape annotations to the pod; the metrics server itself is always on (#607).
    setScrapeAnnotations: true
