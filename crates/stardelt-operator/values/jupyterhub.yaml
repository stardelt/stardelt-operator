hub:
  config:
    GenericOAuthenticator:
      admin_groups:
      - stardelt-admins
      allowed_groups:
      - stardelt-admins
      - stardelt-users
      auth_state_groups_key: oauth_user.groups
      auto_login: true
      client_id: jupyterhub
      login_service: Keycloak
      manage_groups: true
      scope:
      - openid
      - profile
      - email
      username_claim: preferred_username
    JupyterHub:
      authenticator_class: generic-oauth
  extraConfig: {}
  extraEnv:
    STARDELT_OIDC_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          key: jupyterhub
          name: stardelt-oidc-clients
          optional: true
    STARDELT_OIDC_ISSUER_URL:
      valueFrom:
        configMapKeyRef:
          key: issuerUrl
          name: stardelt-identity
          optional: true
    STARDELT_TRINO_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: trinoUrl
          optional: true
    # Nova's public origin, the one allowed to frame the hub and the servers.
    # From the identity contract, never from this file.
    STARDELT_NOVA_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: publicUrl
          optional: true
  # Nova shows and controls the person's workspace (stardelt-nova#652 W3): state,
  # start, stop — never access:servers, so Nova cannot open a server or run code.
  # The chart generates the service token into Secret `hub`, key
  # `hub.services.nova.apiToken`, which Nova reads as NOVA_JUPYTERHUB_API_TOKEN.
  services:
    nova: {}
  loadRoles:
    nova-workspace:
      description: Nova reads workspace state and starts or stops servers for the signed-in person
      services: [nova]
      scopes: ["read:servers", "servers", "read:users:activity", "read:users:name"]
  # The chart's own hub NetworkPolicy is on by default and admits only pods
  # labelled hub.jupyter.org/network-access-hub: "true". Nova is a service, not a
  # spawner-connected pod, so it needs the API port by its own pod label.
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: nova
        ports:
          - port: 8081
            protocol: TCP
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
# The idle culler stops a server nobody uses (upstream default 3600). Nova counts
# down from this number, so it must equal NOVA_WORKSPACE_IDLE_SECONDS in
# src/nova.rs — the test below ties the two.
cull:
  timeout: 3600
proxy:
  chp:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
  service:
    type: ClusterIP
  traefik:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
singleuser:
  cpu:
    guarantee: 0.1
    limit: 1
  defaultUrl: /lab
  extraEnv:
    SPARK_REMOTE: sc://spark-connect.__NAMESPACE__.svc.cluster.local:15002
    STARDELT_SECRET_STORE_URL: http://openbao.__NAMESPACE__.svc.cluster.local:8200
    STARDELT_NOVA_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: publicUrl
          optional: true
  image:
    # The digest is a copy of the platform's pin and must be bumped in both repositories; the
    # test `notebook_task_image_matches_the_single_user_image` fails when values/airflow.yaml
    # disagrees.
    name: ghcr.io/stardelt/jupyter-singleuser
    tag: "dev@sha256:0efafe3e68e62bf6acc19450ba347a4fadbe8fe376d98fdd6bcd75f63fb9f0c4"
    pullSecrets:
      - name: ghcr-creds
  memory:
    guarantee: 256M
    limit: 1G
  startTimeout: 300
  storage:
    type: dynamic
    capacity: 2Gi
    extraVolumes:
      - name: trino-ca
        secret:
          secretName: trino-ca
          optional: true
          items:
            - key: tls.crt
              path: ca.crt
    extraVolumeMounts:
      - name: trino-ca
        mountPath: /etc/stardelt/trino-ca
        readOnly: true
  lifecycleHooks:
    postStart:
      exec:
        command:
          - bash
          - -c
          - 'cp -n /opt/stardelt/notebooks/*.ipynb "$HOME/" || true'
  networkPolicy:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: trino
                app.kubernetes.io/component: coordinator
        ports:
          - port: 8443
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: spark-connect
        ports:
          - port: 15002
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
        ports:
          - port: 8200
            protocol: TCP
