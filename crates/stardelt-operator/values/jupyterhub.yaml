hub:
  config:
    GenericOAuthenticator:
      admin_groups:
      - stardelt-admins
      allowed_groups:
      - stardelt-admins
      - stardelt-users
      auth_state_groups_key: oauth_user.groups
      auto_login: true
      client_id: jupyterhub
      login_service: Keycloak
      manage_groups: true
      scope:
      - openid
      - profile
      - email
      username_claim: preferred_username
    JupyterHub:
      authenticator_class: generic-oauth
  extraConfig: {}
  extraEnv:
    STARDELT_OIDC_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          key: jupyterhub
          name: stardelt-oidc-clients
          optional: true
    STARDELT_OIDC_ISSUER_URL:
      valueFrom:
        configMapKeyRef:
          key: issuerUrl
          name: stardelt-identity
          optional: true
    STARDELT_TRINO_URL:
      valueFrom:
        configMapKeyRef:
          name: stardelt-identity
          key: trinoUrl
          optional: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
proxy:
  chp:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
  service:
    type: ClusterIP
  traefik:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
singleuser:
  cpu:
    guarantee: 0.1
    limit: 1
  defaultUrl: /lab
  extraEnv:
    SPARK_REMOTE: sc://spark-connect.__NAMESPACE__.svc.cluster.local:15002
    STARDELT_SECRET_STORE_URL: http://openbao.__NAMESPACE__.svc.cluster.local:8200
  image:
    # The digest is a copy of the platform's pin and must be bumped in both repositories; the
    # test `notebook_task_image_matches_the_single_user_image` fails when values/airflow.yaml
    # disagrees.
    name: ghcr.io/stardelt/jupyter-singleuser
    tag: "dev@sha256:ce96bf7ca46741cfcbc73a5062173b8aec974787c42a2f3c282bd86a2e17a2e3"
    pullSecrets:
      - name: ghcr-creds
  memory:
    guarantee: 256M
    limit: 1G
  startTimeout: 300
  storage:
    type: dynamic
    capacity: 2Gi
    dynamic:
      storageClass: ""
    extraVolumes:
      - name: trino-ca
        secret:
          secretName: trino-ca
          optional: true
          items:
            - key: tls.crt
              path: ca.crt
    extraVolumeMounts:
      - name: trino-ca
        mountPath: /etc/stardelt/trino-ca
        readOnly: true
  lifecycleHooks:
    postStart:
      exec:
        command:
          - bash
          - -c
          - 'cp -n /opt/stardelt/notebooks/*.ipynb "$HOME/" || true'
  networkPolicy:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: trino
                app.kubernetes.io/component: coordinator
        ports:
          - port: 8443
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: spark-connect
        ports:
          - port: 15002
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
        ports:
          - port: 8200
            protocol: TCP
