# Apache Superset — BI / dashboards.
# Chart: superset/superset 0.15.5, appVersion 5.0.0.
#
# Curated by the operator for the dashboards pillar: the local administrator stays as
# break-glass; people sign in through the platform IdP (O7b). Group roles come from
# `src/superset.rs` (O7b, part 2). The pod reads credentials from Secrets via extraEnvRaw.

image:
  repository: ghcr.io/stardelt/superset
  tag: "dev@sha256:b9ced85d81a0c9efd2ca993f27bba5470e4815aad9d246b93e3ca5e62d26e8cd"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset" > ~/bootstrap; fi

configOverrides:
  iframe_embedding: |
    TALISMAN_ENABLED = False
    HTTP_HEADERS = {}
    SESSION_COOKIE_SAMESITE = "Lax"
    ENABLE_PROXY_FIX = True



extraEnvRaw:
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-secret-key
        key: secret-key
  - name: SUPERSET_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-admin
        key: password
  - name: TRINO_SUPERSET_PASSWORD
    valueFrom:
      secretKeyRef:
        name: trino-password-db
        key: password
        optional: true
  - name: STARDELT_PUBLIC_URL
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: publicUrl
        optional: true
  - name: STARDELT_OIDC_ISSUER
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: issuerUrl
        optional: true
  - name: STARDELT_ADMIN_GROUP
    valueFrom:
      configMapKeyRef:
        name: stardelt-identity
        key: adminGroup
        optional: true
  - name: STARDELT_SUPERSET_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: stardelt-oidc-clients
        key: superset
        optional: true

extraConfigs:
  import_datasources.yaml: |
    databases:
    - database_name: Trino Warehouse
      sqlalchemy_uri: trino://superset@trino:8080/warehouse
      allow_multi_catalog: true
      impersonate_user: true
    - database_name: Trino Shared
      sqlalchemy_uri: trino://superset@trino:8080/shared
      allow_multi_catalog: true
      impersonate_user: true
      extra: >-
        {"allow_multi_catalog": true, "metadata_params": {}, "engine_params": {},
         "metadata_cache_timeout": {}, "schemas_allowed_for_csv_upload": []}
      tables: []

init:
  adminUser:
    username: admin
    firstname: stardelt
    lastname: Admin
    email: admin@stardelt.local
  initscript: |
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles..."
    superset init
    {{ if .Values.init.createAdmin }}
    echo "Creating admin user..."
    superset fab create-admin \
                    --username {{ .Values.init.adminUser.username }} \
                    --firstname {{ .Values.init.adminUser.firstname }} \
                    --lastname {{ .Values.init.adminUser.lastname }} \
                    --email {{ .Values.init.adminUser.email }} \
                    --password "$SUPERSET_ADMIN_PASSWORD" \
                    || true
    {{- end }}
    {{ if .Values.init.loadExamples }}
    echo "Loading examples..."
    superset load_examples
    {{- end }}
    if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
      echo "Importing database connections.... "
      superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
    fi
    # The role the IdP mapping gives every member of stardelt-users ("Gamma", "stardelt-analyst");
    # it must exist before the first sign-in. Needs the "Trino Shared" database that
    # import_datasources.yaml above created. Idempotent: converges the exact permission set.
    echo "Converging the analyst role..."
    python "{{ .Values.extraConfigMountPath }}/superset-analyst-role.py"
  loadExamples: false

supersetNode:
  replicas:
    enabled: true
    replicaCount: 1
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetWorker:
  replicas:
    enabled: true
    replicaCount: 1
  command:
    - "/bin/sh"
    - "-c"
    - ". {{ .Values.configMountPath }}/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=2"
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "1Gi"  }

supersetCeleryBeat:
  enabled: false

supersetWebsockets:
  enabled: false

postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits:   { cpu: "1",   memory: "512Mi" }

redis:
  enabled: true
  master:
    persistence:
      size: 1Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "1",   memory: "256Mi" }
  replica:
    replicaCount: 0

service:
  type: ClusterIP
  port: 8088
