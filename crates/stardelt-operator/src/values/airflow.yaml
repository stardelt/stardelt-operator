# Apache Airflow — DAG-based orchestrator.
#
# Chart: apache-airflow/airflow 1.21.0, appVersion 3.2.0.
# Uses the chart's default apache/airflow:3.2.0 image (no custom image), so
# nothing here needs syncing when the chart version bumps. This is the clean
# platform deployment — DAGs are NOT baked in. Demos inject the nyc_taxi_load
# DAG (and its catalog/S3 env) separately via gitSync; see stardelt-demos.
#
# kind tuning:
#   - executor: KubernetesExecutor — no celery, no redis, no workers
#   - bundled Postgres (Bitnami sub-chart) — single instance, low resources.
#     Could be migrated to CNPG later; bundled keeps this minimal for now.
#   - single replicas of api-server / scheduler / dag-processor / triggerer
#   - heavy resource trims for laptop-scale

executor: KubernetesExecutor

# DB migrations + the default-user job must run as plain manifests, NOT Helm
# hooks. The chart defaults these to post-install hooks; under Flux/helm `--wait`
# Helm waits for the Deployments to become Ready *before* firing the hooks, but
# every component blocks on its `wait-for-airflow-migrations` init until the
# migrate job has run — a deadlock that leaves the DB unmigrated. Disabling the
# hooks lets the jobs apply alongside the Deployments and break the cycle.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

# Stable Fernet/JWT/internal-API secret (kind-only, NEVER use in real envs).
# Without these the chart auto-generates, but a re-install would invalidate
# the database; pinning here makes upgrades safe.
fernetKey: "5oYDV8KzcRrChx4tWN5gP1NQXMRr9CkBaVYU6jLDB2I="
jwtSecret: "stardelt-mvp-jwt-do-not-use-in-prod"

# DAGs come from the image, not gitSync
dags:
  gitSync:
    enabled: false
  persistence:
    enabled: false

# Logs in emptyDir — fine for kind, lost on pod restart
logs:
  persistence:
    enabled: false

# Stateful components turned off
redis:
  enabled: false

# Celery workers — KubernetesExecutor doesn't use them; 0 replicas
workers:
  replicas: 0
  persistence:
    enabled: false

# Bundled Postgres — single instance, small storage
postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m",  memory: "256Mi" }
      limits:   { cpu: "1",    memory: "512Mi" }

# Single-replica + smaller resources for each Airflow component
apiServer:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { cpu: "2",    memory: "1Gi"   }

scheduler:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { cpu: "2",    memory: "1Gi"   }

dagProcessor:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

triggerer:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: { cpu: "50m",  memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }

# Static admin user for the dev environment. Same convention as the
# static-dev-user in Nova (Stage 3): no real auth in MVP.
webserverSecretKey: "stardelt-mvp-webserver-key"
